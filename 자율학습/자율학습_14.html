<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: black;
        }
        .container {
            width: 700px;
            height: 600px;
            display: grid;
            grid-template-areas: 
            "box1 box1 box2 box2"
            "box1 box1 box3 box4"
            "box1 box1 box3 box4"
            "box5 box5 box3 box4";
            gap: 10px;
        }
        .box {
            background-color: yellow;
            border: 1px solid #222;
            text-align: center;
        }
        #box1 {
            grid-area: box1;
        }
        #box2 {
            grid-area: box2;
        }
        #box3 {
            grid-area: box3;
        }
        #box4 {
            grid-area: box4;
        }
        #box5 {
            grid-area: box5;
        }
    </style>
</head>
<body>
    <div class="container">
            <div class="box" id="box1">1</div>
            <div class="box" id="box2">2</div>
            <div class="box" id="box3">3</div>
            <div class="box" id="box4">4</div>
            <div class="box" id="box5">5</div>
    </div>
</body>
</html>
