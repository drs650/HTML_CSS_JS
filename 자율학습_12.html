<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플렉스 박스 레이아웃</title>

    <style>
        #container {
            text-align: center;
        }
        .box {
            padding: 0.2em;
            margin: 0.2em;
        }

        @media screen and (min-width: 1024px) {
            #container {
                padding: 1em;
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                padding: 2em 1em;
            }
            /* .box {
                flex: 0 0 33.33%;
                max-width: 33.33%;
                padding: 0 1em;
            } */
        }
    </style>

</head>
<body>
    <div id="container">
        <div class="row">
            <div class="box"><img src="images/kitten-1.jpg" alt=""></div>
            <div class="box"><img src="images/kitten-2.jpg" alt=""></div>
            <div class="box"><img src="images/kitten-3.jpg" alt=""></div>
        </div>
        
    </div>

</body>
</html>
